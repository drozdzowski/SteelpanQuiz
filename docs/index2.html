<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bertram "Bertie" Marshall O.R.T.T. National Steelpan Quiz and Spelling Bee Competition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700&family=Open+Sans:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

<style>
* {
box-sizing: border-box;
}

:root {
--rim-color: #222;
--cream-tip: #fffdd0;
--neon-blue: #00e5ff;
--neon-pink: #ff007b;
--highlander-blue: #002366;
--highlander-orange: #f37021;
--hammered-grain: url("data:image/svg+xml,%3Csvg viewBox='0 0 250 250' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.3'/%3E%3C/svg%3E");
/* 1. CUSTOM STICK CURSOR */
--stick-cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32' viewBox='0 0 32 32'><line x1='5' y1='27' x2='25' y2='7' stroke='%2300e5ff' stroke-width='4' stroke-linecap='round'/><circle cx='25' cy='7' r='5' fill='%23fffdd0'/></svg>") 25 7, auto;
}

html {
width: 100%;
max-width: 100%;
overflow-x: hidden;
}

body {
margin: 0;
background:
radial-gradient(circle at 50% 12%, rgba(243,112,33,0.18), transparent 30%),
radial-gradient(circle at 18% 30%, rgba(0,229,255,0.12), transparent 28%),
linear-gradient(180deg, #111820 0%, #07090d 48%, #010204 100%);
display: flex;
flex-direction: column;
align-items: center;
min-height: 100vh;
font-family: 'Arial Black', Gadget, sans-serif;
color: white;
overflow-x: hidden;
width: 100%;
max-width: 100%;
padding: 0 12px 28px;
}

.site-header.home-header {
padding: clamp(10px, 2vw, 16px) 0 clamp(14px, 2.5vw, 22px);
}

.site-header .main-title {
margin: 0 auto;
line-height: 0;
}

.quiz-logo {
display: block;
width: min(82vw, 528px);
max-height: 130px;
height: auto;
object-fit: contain;
margin: 0 auto;
}

.intro {
width: min(100%, 760px);
margin: 12px auto 16px;
font-family: 'Open Sans', Arial, sans-serif;
font-size: clamp(13px, 2.8vw, 17px);
line-height: 1.35;
text-align: center;
}

.main-stage {
display: flex;
flex-direction: column;
align-items: center;
width: min(100%, 450px);
margin-top: clamp(12px, 2.5vw, 22px);
}

.pan-wrap {
box-sizing: content-box;
position: relative;
width: min(390px, 40dvh, calc(100vw - 56px));
width: min(390px, 40dvh, calc(100dvw - 56px));
aspect-ratio: 1;
border-radius: 50%;
border: 0;
box-shadow:
0 46px 90px rgba(0,0,0,0.82),
0 14px 28px rgba(0,229,255,0.12),
inset 0 0 34px rgba(255,255,255,0.32),
inset 0 -24px 44px rgba(0,0,0,0.55);
overflow: hidden;
background: #111;
isolation: isolate;
}

.pan-wrap::before,
.pan-wrap::after {
content: "";
position: absolute;
inset: 0;
border-radius: 50%;
pointer-events: none;
z-index: 2;
}

.pan-wrap::before {
box-shadow:
inset 0 0 0 clamp(7px, 1.9vw, 13px) rgba(42,47,51,0.9),
inset 0 0 0 clamp(10px, 2.6vw, 18px) rgba(220,226,229,0.48),
inset 18px 22px 36px rgba(255,255,255,0.35),
inset -20px -26px 42px rgba(0,0,0,0.46);
}

.pan-wrap::after {
background:
radial-gradient(circle at 34% 24%, rgba(255,255,255,0.34), transparent 18%),
radial-gradient(circle at 72% 82%, rgba(0,0,0,0.32), transparent 24%),
linear-gradient(145deg, rgba(255,255,255,0.18), transparent 42%, rgba(0,0,0,0.28));
mix-blend-mode: screen;
opacity: 0.62;
}

.pan-img {
display: block;
width: 100%;
height: 100%;
object-fit: cover;
transform: scale(1.08);
filter: contrast(1.14) saturate(1.03) brightness(0.98);
}

.sticks-area {
display: flex;
justify-content: space-between;
width: min(372px, 38dvh, calc(100vw - 56px));
width: min(372px, 38dvh, calc(100dvw - 56px));
margin-top: clamp(-38px, -6vw, -22px);
z-index: 20;
}

.stick {
position: relative;
width: 20px;
height: clamp(124px, 17dvh, 160px);
border-radius: 10px;
display: flex;
justify-content: center;
align-items: center;
text-decoration: none;
transition: .3s cubic-bezier(.175,.885,.32,1.275);
}

.stick::before {
content: ''; position: absolute; top: -5px; width: 30px; height: clamp(38px, 5.6dvh, 48px);
background: linear-gradient(135deg, #ce1126 0%, #ce1126 35%, #ffffff 35%, #ffffff 42%, #000000 42%, #000000 58%, #ffffff 58%, #ffffff 65%, #ce1126 65%, #ce1126 100%);
border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.4);
}

.stick-left { background: var(--neon-blue); box-shadow: 0 0 15px var(--neon-blue); transform: rotate(25deg); }
.stick-right { background: var(--neon-pink); box-shadow: 0 0 15px var(--neon-pink); transform: rotate(-25deg); }

.stick-text { writing-mode: vertical-rl; font-weight: 900; color: white; font-size: 14px; transform: translateY(18px); }
.stick-left .stick-text { transform: translateY(18px) rotate(180deg); }

@media (max-width: 650px) {
.quiz-logo {
width: min(94vw, 504px);
max-height: 126px;
}

.main-stage {
margin-top: 24px;
}
}
</style>
    <link rel="stylesheet" href="assets/css/base.css">
    <link rel="stylesheet" href="assets/css/layout.css">
    <link rel="stylesheet" href="assets/css/components.css">
</head>

<body>

<header class="site-header home-header">
<h1 class="main-title">
 <img src="images/website-quiz-logo.jpeg" alt="New quiz logo" class="quiz-logo"></h1>
</header>

<div class="main-stage">
<div class="pan-wrap" id="pan">
<img src="images/tenorsteel.png" class="pan-img" alt="Steelpan">
</div>

<div class="sticks-area">
<a href="register.html" class="stick stick-left">
<span class="stick-text">REGISTER</span>
</a>
<a href="donate.html" class="stick stick-right">
<span class="stick-text">DONATE</span>
</a>
</div>
</div>

<div class="intro">
<p>
Launched in 2024 by the World Steelpan Thrust of Trinidad and Tobago and the Highlanders Steel Orchestra in honour of Highlanders Steel Orchestra's legendary leader and master pan-tuner, Bertram "Bertie" Marshall, O.R.T.T.
</p>
</div>

</body>
</html>
