<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - The Bertram Marshall Quiz</title>
    <link href="https://fonts.googleapis.com/css2?family=Grand+Hotel&display=swap" rel="stylesheet">
    <style>
        :root { --highlander-blue: #002366; --highlander-orange: #f37021; }
        body { margin: 0; background: #ffffff; color: #222; font-family: Arial, sans-serif; line-height: 1.6; display: flex; flex-direction: column; align-items: center; }
        .site-header { background-color: var(--highlander-blue); width: 100%; padding: 30px 0; text-align: center; }
        .name-part { font-family: 'Grand Hotel', cursive; color: var(--highlander-orange); font-size: 3.5rem; }
        .container { max-width: 800px; margin: 50px auto; padding: 40px; background: #f9f9f9; border: 1px solid #dddddd; border-radius: 15px; width: 90%; }
        h2 { color: var(--highlander-blue); border-bottom: 2px solid var(--highlander-orange); padding-bottom: 10px; }
        .back-btn { display: inline-block; margin-top: 30px; padding: 12px 25px; background: var(--highlander-blue); color: white; text-decoration: none; border-radius: 5px; font-weight: bold; }
        .back-btn:hover { background: var(--highlander-orange); }
    </style>
</head>
<body>
<header class="site-header">
    <h1 class="main-title"><span class="name-part">Registration</span></h1>
</header>
<div class="container">
    <h2>Join the Competition</h2>
    <p>Sign up your team for the next Bertram "Bertie" Marshall Steelpan Quiz and Spelling Bee. Please provide your steel orchestra or school details and contact information.</p>
