<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bertram "Bertie" Marshall O.R.T.T. National Steelpan Quiz and Spelling Bee Competition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700&family=Open+Sans:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

<style>
* {
box-sizing: border-box;
}

:root {
--rim-color: #222;
--cream-tip: #fffdd0;
--neon-blue: #00e5ff;
--neon-pink: #ff007b;
--highlander-blue: #002366;
--highlander-orange: #f37021;
--hammered-grain: url("data:image/svg+xml,%3Csvg viewBox='0 0 250 250' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.3'/%3E%3C/svg%3E");
/* 1. CUSTOM STICK CURSOR */
--stick-cursor: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='32' height='32' viewBox='0 0 32 32'><line x1='5' y1='27' x2='25' y2='7' stroke='%2300e5ff' stroke-width='4' stroke-linecap='round'/><circle cx='25' cy='7' r='5' fill='%23fffdd0'/></svg>") 25 7, auto;
}

html {
width: 100%;
max-width: 100%;
overflow-x: hidden;
}

body {
margin: 0;
background:
radial-gradient(circle at 50% 12%, rgba(243,112,33,0.18), transparent 30%),
radial-gradient(circle at 18% 30%, rgba(0,229,255,0.12), transparent 28%),
linear-gradient(180deg, #111820 0%, #07090d 48%, #010204 100%);
display: flex;
flex-direction: column;
align-items: center;
min-height: 100vh;
font-family: 'Arial Black', Gadget, sans-serif;
color: white;
overflow-x: hidden;
width: 100%;
max-width: 100%;
padding: 0 12px 28px;
}

.site-header.home-header {
padding: clamp(10px, 2vw, 16px) 0 clamp(14px, 2.5vw, 22px);
}

.site-header .main-title {
margin: 0 auto;
line-height: 0;
}

.quiz-logo {
display: block;
width: min(70vw, 440px);
max-height: 108px;
height: auto;
object-fit: contain;
margin: 0 auto;
}

.intro {
width: min(100%, 760px);
margin: 12px auto 16px;
font-family: 'Open Sans', Arial, sans-serif;
font-size: clamp(13px, 2.8vw, 17px);
line-height: 1.35;
text-align: center;
}

.main-stage {
display: flex;
flex-direction: column;
align-items: center;
width: min(100%, 450px);
margin-top: clamp(12px, 2.5vw, 22px);
}

.pan-base {
box-sizing: content-box;
position: relative;
width: min(390px, 40dvh, calc(100vw - 56px));
width: min(390px, 40dvh, calc(100dvw - 56px));
aspect-ratio: 1;
border-radius: 50%;
border: clamp(8px, 3vw, 15px) solid var(--rim-color);
box-shadow: 0 40px 80px rgba(0,0,0,0.8), inset 0 0 60px rgba(0,0,0,0.7);
display: flex;
justify-content: center;
align-items: center;
overflow: hidden;
background: var(--hammered-grain), radial-gradient(circle at 50% 50%, rgba(0,0,0,0.4) 0%, transparent 80%), conic-gradient(from 180deg at 50% 50%, #7f8c8d 0deg, #bdc3c7 40deg, #fff 80deg, #95a5a6 120deg, #2c3e50 160deg, #fff 200deg, #bdc3c7 240deg, #7f8c8d 280deg, #fff 320deg, #7f8c8d 360deg);
}

.note {
position: absolute;
display: flex;
justify-content: center;
align-items: center;
text-align: center;
text-decoration: none;
color: #222;
font-weight: 900;
text-transform: uppercase;
cursor: var(--stick-cursor);
transition: transform 0.1s ease;
background-image: var(--hammered-grain), radial-gradient(circle at 35% 35%, #fff 0%, #bdc3c7 40%, #95a5a6 100%);
box-shadow: inset 6px 6px 12px rgba(0,0,0,0.4), inset -2px -2px 8px rgba(255,255,255,0.7), 2px 2px 4px rgba(0,0,0,0.3);
}

/* 2. INDIVIDUAL NOTE SINKING (CSS ONLY) */
.note:active {
    transform: scale(0.9) rotate(var(--r)) !important;
    box-shadow: inset 15px 15px 30px rgba(0,0,0,0.8) !important;
    filter: brightness(0.8);
}

.note-center {
width: 30.25%;
height: 30.25%;
border-radius: 50%;
z-index: 10;
--r: 0deg;
}

.note-peripheral {
width: 17.14%;
height: 21.17%;
border-radius: 50% 50% 50% 50% / 25% 25% 75% 75%;
}

.note span {
pointer-events: none;
font-size: clamp(7px, 2vw, 10px);
padding: 5px;
transform: rotate(calc(var(--r)*-1));
}

.note-center span {
font-size: clamp(10px, 2.8vw, 14px);
}

.sticks-area {
display: flex;
justify-content: space-between;
width: min(372px, 38dvh, calc(100vw - 56px));
width: min(372px, 38dvh, calc(100dvw - 56px));
margin-top: clamp(-38px, -6vw, -22px);
z-index: 20;
}

.stick {
position: relative;
width: 20px;
height: clamp(124px, 17dvh, 160px);
border-radius: 10px;
display: flex;
justify-content: center;
align-items: center;
text-decoration: none;
transition: .3s cubic-bezier(.175,.885,.32,1.275);
}

.stick::before {
content: ''; position: absolute; top: -5px; width: 30px; height: clamp(38px, 5.6dvh, 48px);
background: linear-gradient(135deg, #ce1126 0%, #ce1126 35%, #ffffff 35%, #ffffff 42%, #000000 42%, #000000 58%, #ffffff 58%, #ffffff 65%, #ce1126 65%, #ce1126 100%);
border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.4);
}

.stick-left { background: var(--neon-blue); box-shadow: 0 0 15px var(--neon-blue); transform: rotate(25deg); }
.stick-right { background: var(--neon-pink); box-shadow: 0 0 15px var(--neon-pink); transform: rotate(-25deg); }

/* 3. STICK RESONANCE ANIMATION */
@keyframes resonateBlue {
    0% { box-shadow: 0 0 15px var(--neon-blue); transform: rotate(25deg) scale(1); }
    50% { box-shadow: 0 0 60px var(--neon-blue), 0 0 100px var(--neon-blue); transform: rotate(25deg) scale(1.1); }
    100% { box-shadow: 0 0 15px var(--neon-blue); transform: rotate(25deg) scale(1); }
}
@keyframes resonatePink {
    0% { box-shadow: 0 0 15px var(--neon-pink); transform: rotate(-25deg) scale(1); }
    50% { box-shadow: 0 0 60px var(--neon-pink), 0 0 100px var(--neon-pink); transform: rotate(-25deg) scale(1.1); }
    100% { box-shadow: 0 0 15px var(--neon-pink); transform: rotate(-25deg) scale(1); }
}

.stick-left.active-pulse { animation: resonateBlue 0.4s ease-out; }
.stick-right.active-pulse { animation: resonatePink 0.4s ease-out; }

.stick-text { writing-mode: vertical-rl; font-weight: 900; color: white; font-size: 14px; }
.stick-left .stick-text { transform: rotate(180deg); }

@media (max-width: 650px) {
.quiz-logo {
width: min(86vw, 420px);
max-height: 105px;
}

.main-stage {
margin-top: 24px;
}
}
</style>
    <link rel="stylesheet" href="assets/css/base.css">
    <link rel="stylesheet" href="assets/css/layout.css">
    <link rel="stylesheet" href="assets/css/components.css">
</head>

<body>

<header class="site-header home-header">
<h1 class="main-title">
 <img src="images/website-quiz-logo.jpeg" alt="New quiz logo" class="quiz-logo"></h1>
</header>

<div class="main-stage">
<div class="pan-base" id="pan">
<a href="quiz-categories.html" class="note note-center" data-freq="261.63">
<span>QUIZ<br>CATEGORIES</span>
</a>
<div id="peripheral-container"></div>
</div>

<div class="sticks-area">
<a href="register.html" class="stick stick-left">
<span class="stick-text">REGISTER</span>
</a>
<a href="donate.html" class="stick stick-right">
<span class="stick-text">DONATE</span>
</a>
</div>
</div>

<div class="intro">
<p>
Launched in 2024 by the World Steelpan Thrust of Trinidad and Tobago and the Highlanders Steel Orchestra in honour of Highlanders Steel Orchestra's legendary leader and master pan-tuner, Bertram "Bertie" Marshall, O.R.T.T.
</p>
</div>

<script>
// Logic for individual links
const items = [
    { name: "About the Quiz", file: "about-the-quiz.html" },
    { name: "Sources", file: "sources.html" },
    { name: "Games", file: "games.html" },
    { name: "Play Yuhself", file: "play-yuhself.html" },
    { name: "Sponsors", file: "sponsors.html" },
    { name: "Previous Quizzes", file: "previous-quizzes.html" },
    { name: "Practice", file: "practice.html" },
    { name: "Podcast", file: "podcast.html" },
    { name: "Blog", file: "blog.html" },
    { name: "News", file: "news.html" },
    { name: "Fun FAQs", file: "fun-faqs.html" },
    { name: "Contact", file: "contact.html" }
];

const frequencies=[277,311,349,392,440,493,523,587,659,698,783,880];
const pan=document.getElementById('pan');
const container=document.getElementById('peripheral-container');
const NOTE_W_RATIO=85/496;
const NOTE_H_RATIO=105/496;
const RADIUS_RATIO=180.5/496;

items.forEach((item, i) => {
    const note = document.createElement('a');
    note.href = item.file; 
    note.className = 'note note-peripheral';
    note.dataset.index = i;
    note.dataset.freq = frequencies[i];
    note.innerHTML = `<span>${item.name}</span>`;
    container.appendChild(note);
});

function positionNotes() {
    const panSize = pan.clientWidth;
    const radius = panSize * RADIUS_RATIO;
    const noteW = panSize * NOTE_W_RATIO;
    const noteH = panSize * NOTE_H_RATIO;

    container.querySelectorAll('.note-peripheral').forEach((note) => {
        const i = Number(note.dataset.index);
        const angle = (i * 30);
        const rad = angle * (Math.PI/180);
        const x = Math.cos(rad - Math.PI/2) * radius;
        const y = Math.sin(rad - Math.PI/2) * radius;

        note.style.left = `calc(50% + ${x}px - ${noteW / 2}px)`;
        note.style.top = `calc(50% + ${y}px - ${noteH / 2}px)`;
        note.style.transform = `rotate(${angle}deg)`;
        note.style.setProperty('--r', `${angle}deg`);
    });
}

positionNotes();
window.addEventListener('resize', positionNotes);

// Sound Engine
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function playPing(freq) {
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(0, audioCtx.currentTime);
    gain.gain.linearRampToValueAtTime(0.3, audioCtx.currentTime + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.5);
}

// INTERCEPT CLICKS TO PREVENT AUDIO CUTOFF
document.addEventListener('click', function(e) {
    const link = e.target.closest('a');
    if (!link) return;

    // 1. Determine Frequency
    const freq = link.dataset.freq ? parseFloat(link.dataset.freq) : 180;
    
    // 2. Play Sound
    playPing(freq);

    // 3. Stick animation (if it's a stick)
    if (link.classList.contains('stick')) {
        link.classList.add('active-pulse');
        setTimeout(() => link.classList.remove('active-pulse'), 400);
    }

    // 4. Handle Navigation with a slight delay so tone doesn't cut off
    const href = link.getAttribute('href');
    if (href && !href.startsWith('#')) {
        e.preventDefault(); // Stop immediate page switch
        setTimeout(() => {
            window.location.href = href;
        }, 300); // 300ms is enough for the "Ping" to be heard before the page unloads
    }
});
</script>

</body>
