<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Categories - The Bertram Marshall Quiz</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --highlander-blue: #002366;
            --highlander-orange: #f37021;
            --overlay: rgba(0, 35, 102, 0.85);
        }
        
        body { 
            margin: 0; 
            background:
                radial-gradient(circle at 50% 0%, rgba(243,112,33,0.18), transparent 34%),
                radial-gradient(circle at 12% 28%, rgba(0,35,102,0.9), transparent 38%),
                linear-gradient(180deg, #071224 0%, #03060c 46%, #000103 100%);
            color: #ffffff; 
            font-family: 'Arial', sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
        }

        .site-header { 
            background-color: var(--highlander-blue); 
            width: 100%; 
            padding: 20px 0; 
            text-align: center; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.5); 
        }

        .name-part { 
            font-family: 'Inter', Arial, sans-serif; 
            color: var(--highlander-orange); 
            font-size: 3rem; 
        }
        h1, h2, h3, h4, h5, h6 { font-family: 'Inter', Arial, sans-serif; }

        .categories-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr); 
            gap: 12px;
            width: 98%;
            max-width: 1400px;
            margin: 30px auto;
        }

        .category-card {
            position: relative;
            height: 220px; 
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #333;
            text-decoration: none;
            display: block;
            transition: all 0.3s ease;
            /* Fallback color if image is missing */
            background-color: var(--highlander-blue);
        }

        .category-card:nth-child(even) { background-color: #1a1a1a; }

        .category-card:hover {
            transform: translateY(-8px);
            border-color: var(--highlander-orange);
            box-shadow: 0 10px 20px rgba(243, 112, 33, 0.3);
        }

        .category-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            filter: saturate(1.18) contrast(1.05);
        }

        .overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(transparent 20%, var(--overlay) 100%);
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding: 15px;
            text-align: center;
        }

        .category-label {
            color: white;
            font-size: 0.85rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.9);
            line-height: 1.2;
        }

        .footer-area { margin: 30px 0 50px 0; }

        .back-btn { 
            padding: 12px 30px; 
            background: var(--highlander-orange); 
            color: white; 
            text-decoration: none; 
            border-radius: 5px; 
            font-weight: bold; 
        }

        @media (max-width: 1200px) { .categories-grid { grid-template-columns: repeat(3, 1fr); } }
        @media (max-width: 768px) { .categories-grid { grid-template-columns: repeat(2, 1fr); } .category-card { height: 170px; } }
    </style>
    <link rel="stylesheet" href="assets/css/base.css">
    <link rel="stylesheet" href="assets/css/layout.css">
    <link rel="stylesheet" href="assets/css/components.css">
    <script src="assets/js/site-nav.js" defer></script>
</head>
<body>

<div data-site-nav></div>

<header class="site-header">
    <h1 class="main-title">
        <span class="name-part">What Will You Learn Today?</span>
    </h1>
</header>
<div class="categories-grid">
    <a href="history.html" class="category-card">
        <img src="images/category-thumbs/steelpan-history.jpg" alt="Steelpan History">
        <div class="overlay"><span class="category-label">Steelpan History</span></div>
    </a>

    <a href="thrust.html" class="category-card">
        <img src="images/category-thumbs/world-steelpan-thrust.jpg" alt="The World Steelpan Thrust">
        <div class="overlay"><span class="category-label">The World Steelpan Thrust</span></div>
    </a>

    <a href="highlanders-info.html" class="category-card">
        <img src="images/category-thumbs/highlanders-steel-orchestra.jpg" alt="Highlanders Steel Orchestra">
        <div class="overlay"><span class="category-label">Highlanders Steel Orchestra</span></div>
    </a>

    <a href="music.html" class="category-card">
        <img src="images/category-thumbs/music-for-the-pan.jpg" alt="Music for the Pan">
        <div class="overlay"><span class="category-label">Music for the Pan</span></div>
    </a>

    <a href="panyards.html" class="category-card">
        <img src="images/category-thumbs/panyards-and-bands.png" alt="Panyards and Bands">
        <div class="overlay"><span class="category-label">Panyards and Bands</span></div>
    </a>

    <a href="tuning.html" class="category-card">
        <img src="images/category-thumbs/pan-tuning.png" alt="Pan Tuning">
        <div class="overlay"><span class="category-label">Pan Tuning</span></div>
    </a>

    <a href="innovations-info.html" class="category-card">
        <img src="images/category-thumbs/innovations-innovators.jpg" alt="Innovations/Innovators">
        <div class="overlay"><span class="category-label">Innovations/<br>Innovators</span></div>
    </a>

    <a href="competitions.html" class="category-card">
        <img src="images/category-thumbs/steelpan-competitions.jpg" alt="Steelpan Competitions">
        <div class="overlay"><span class="category-label">Steelpan Competitions</span></div>
    </a>

    <a href="WomenInPan.html" class="category-card">
        <img src="images/category-thumbs/women-in-pan.png" alt="Women in Pan">
        <div class="overlay"><span class="category-label">Women in Pan</span></div>
    </a>

</div>

<div class="footer-area">
<a href="index.html" class="back-btn">← Back to the Pan</a>
</div>

</body>
</html>
